services:
  - type: web
    name: iot-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Neon connection string in the Render dashboard
